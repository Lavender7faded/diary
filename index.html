const SB_URL='https://tnwvodcsnjfqeyeelvhl.supabase.co';const SB_KEY='sb_publishable_J44_OTe7LLU7NDjRkzKVWA_Fu9UuM6t';
const Sync={
  st:(()=>{try{return JSON.parse(localStorage.getItem('diary.sync'))||{}}catch(e){return{}}})(),
  busy:false,msg:'',timer:null,
  on(){return !!(SB_URL&&SB_KEY)},
  save(){localStorage.setItem('diary.sync',JSON.stringify(this.st))},
  hdr(tok){const h={'apikey':SB_KEY,'Content-Type':'application/json'};if(tok)h['Authorization']='Bearer '+tok;return h},
  async auth(path,body){
    const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:this.hdr(),body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.msg||j.error_description||j.message||('Помилка '+r.status));
    return j;
  },
  setSession(j){
    if(!j.access_token)throw new Error('Потрібно підтвердити пошту — перевір лист');
    this.st.session={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,email:(j.user&&j.user.email)||this.st.session&&this.st.session.email};
    this.save();
  },
  async signIn(email,pw,create){
    this.msg='';
    try{
      let j;
      if(create){j=await this.auth('signup',{email,password:pw});if(!j.access_token)j=await this.auth('token?grant_type=password',{email,password:pw})}
      else j=await this.auth('token?grant_type=password',{email,password:pw});
      this.st.lastPull=0;this.st.lastPush=0;this.setSession(j);
      await this.run();
    }catch(e){this.msg=e.message==='Invalid login credentials'?'Невірна пошта або пароль':e.message;render()}
  },
  signOut(){this.st={};this.save();this.msg='';render()},
  async token(){
    const s=this.st.session;if(!s)return null;
    if(Date.now()<s.exp)return s.access;
    const j=await this.auth('token?grant_type=refresh_token',{refresh_token:s.refresh});
    this.setSession(j);return this.st.session.access;
  },
  kick(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),1500)},
  async run(){
    if(!this.on()||!this.st.session||this.busy)return;
    this.busy=true;
    try{
      const tok=await this.token();
      // 1) отримати зміни з хмари
      const r=await fetch(`${SB_URL}/rest/v1/entries?select=id,data,updated,deleted&updated=gt.${this.st.lastPull||0}&order=updated.asc&limit=5000`,{headers:this.hdr(tok)});
      if(r.status===401)throw new Error('Потрібно увійти знову');
      if(!r.ok)throw new Error('Помилка '+r.status);
      const rows=await r.json();let changed=false,maxU=this.st.lastPull||0;
      const map=new Map(Store.data.entries.map(e=>[e.id,e]));
      for(const x of rows){maxU=Math.max(maxU,x.updated);const o=map.get(x.id);
        if(!o||x.updated>(o.updated||0)){const e={...x.data,id:x.id,updated:x.updated,deleted:!!x.deleted};map.set(x.id,e);changed=true}}
      if(changed){Store.data.entries=[...map.values()];Store.save()}
      this.st.lastPull=maxU;
      // 2) відправити свої зміни
      const out=Store.data.entries.filter(e=>(e.updated||0)>(this.st.lastPush||0));
      if(out.length){
        const body=out.map(e=>{const {deleted,...d}=e;return{id:e.id,data:d,updated:e.updated||0,deleted:!!e.deleted}});
        const w=await fetch(`${SB_URL}/rest/v1/entries?on_conflict=user_id,id`,{method:'POST',headers:{...this.hdr(tok),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});
        if(!w.ok)throw new Error('Не вдалося зберегти в хмару ('+w.status+')');
        this.st.lastPush=Math.max(...out.map(e=>e.updated||0));
      }
      this.save();this.msg='Синхронізовано о '+hm(new Date());
      if(changed&&!document.getElementById('bg').classList.contains('show'))render();else if(tab==='set')render();
    }catch(e){this.msg=(e.message||'Помилка').replace('Failed to fetch','Немає звʼязку — спробую пізніше');if(tab==='set')render()}
    this.busy=false;
  }
};

/* ---- диктування ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toggleLang(){recLang=recLang==='uk-UA'?'ru-RU':'uk-UA';$('#lg').textContent=recLang==='uk-UA'?'UK':'RU';if(rec){stopRec();toggleRec()}}
function toggleRec(){
  if(rec){stopRec();return}
  if(!SR){$('#mh').textContent='Тут нема вбудованого диктування. Натисни 🎤 на клавіатурі телефону чи планшета.';$('#tx').focus();return}
  rec=new SR();rec.lang=recLang;rec.continuous=true;rec.interimResults=true;
  const ta=$('#tx');const base=ta.value?ta.value.replace(/\s*$/,' '):'';let fin='';
  rec.onresult=ev=>{let it='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else it+=r[0].transcript}ta.value=base+fin+it};
  rec.onerror=()=>{$('#mh').textContent='Не вийшло увімкнути мікрофон. Дозволь доступ або натисни 🎤 на клавіатурі.';stopRec()};
  rec.onend=()=>{if(rec){rec=null;const m=$('#mic');m&&m.classList.remove('rec')}};
  try{rec.start();$('#mic').classList.add('rec');$('#mh').textContent='Слухаю… натисни ще раз, щоб зупинити.'}catch(e){rec=null}
}
function stopRec(){if(rec){const r=rec;rec=null;try{r.stop()}catch(e){}}const m=$('#mic');if(m)m.classList.remove('rec');const h=$('#mh');if(h)h.textContent=''}

function exportData(){
  const b=new Blob([JSON.stringify(Store.data,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shchodennyk-'+ymd(new Date())+'.json';a.click();
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.entries))throw 0;
    const map=new Map(Store.data.entries.map(e=>[e.id,e]));
    d.entries.forEach(e=>{const o=map.get(e.id);if(!o||(e.updated||0)>(o.updated||0))map.set(e.id,e)});
    Store.data.entries=[...map.values()];Store.save();render();Sync.kick();alert('Готово')}catch(e){alert('Не вдалося прочитати файл')}};
  r.readAsText(f);
}
